name: Scrape and Deploy Contests

on:
  schedule:
    - cron: '10 * * * *'  # Se ejecuta cada hora (minuto 10)
    - cron: '40 * * * *'  # Revisión intermedia cada hora (minuto 40)
  push:
    branches:
      - main            # Se ejecuta automáticamente ante cada actualización
  workflow_dispatch:     # Permite ejecutarlo manualmente desde GitHub

jobs:
  scrape_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Fix Existing Times
        run: node fix_times.js
        continue-on-error: true
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Run Scraper and Sync to Firestore
        run: node parse.js
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

